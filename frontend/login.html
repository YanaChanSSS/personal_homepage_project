<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录</title>
    <link rel="stylesheet" href="/frontend/css/shared.css" />
</head>
<body>
    <!-- 主要表单容器 -->
    <div class="form-container">
        <div class="form-content">
            <h1 class="form-title">登录</h1>
            <form id="loginForm" novalidate>
                <div class="form-group">
                    <label for="loginUsername" class="form-label">用户名/邮箱</label>
                    <input 
                        type="text" 
                        id="loginUsername" 
                        name="username" 
                        required 
                        placeholder="请输入用户名或邮箱" 
                        class="form-input"
                        autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="loginPassword" class="form-label">密码</label>
                    <input 
                        type="password" 
                        id="loginPassword" 
                        name="password" 
                        required 
                        placeholder="请输入密码" 
                        class="form-input"
                        autocomplete="current-password">
                </div>
                <button type="submit" class="form-button" id="loginButton">登录</button>
            </form>
            <div class="form-footer">
                <p>还没有账户？<a href="/frontend/register.html" class="form-link">立即注册</a></p>
            </div>
        </div>
    </div>
    
    <!-- 全局消息提示 -->
    <div id="message" class="message"></div>

    <script type="module">
        // 导入并初始化登录模块
        import LoginModule from '/frontend/js/login.js';
        // 初始化在模块内部完成
    </script>
</body>
</html>
